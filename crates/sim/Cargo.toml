[package]
name = "celld-sim"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
license = "Apache-2.0"
publish = false
description = "Deterministic simulation of the celld coordination core"

# The simulator drives `celld-logic` and nothing else. No clock, no system
# randomness and no hash iteration order can reach it, so a run depends only
# on its seed.
[dependencies]
celld-logic.workspace = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(celld_internal_tests)"]
